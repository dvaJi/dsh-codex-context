packages: []

# The @deepseek-ai/* packages are provided by the host dsh installation at
# runtime (in-box resolution) and by a source checkout during development.
# Never auto-install them here: the npm mirrors hold stale RCs and several
# packages are workspace-internal.
autoInstallPeers: false

# pnpm ≥10 refuses dependency build scripts until explicitly allowed.
# esbuild (a vitest dependency) needs its postinstall to place the binary.
allowBuilds:
  esbuild: true
