# Development overlay: load dsh-codex-context from this source checkout into a
# dsh run-from-source composition without installing it as a package.
#
#   pnpm build
#   pnpm dsh web --patch ./dev/cordis.dev.yml
#
# A leaf row's name cannot be rewritten in place and two rows sharing one id
# are rejected at mount, so the overlay disables the base `compaction-basic`
# row and mounts this engine as its own row. Replace <abs-path-to-repo> with
# this checkout's absolute path.

- id: compaction-basic
  disabled: true
- insert:
    - id: codex-context
      name: '<abs-path-to-repo>/lib/index.js'
      config:
        targetActiveTokens: 35000
        minRetainedNodes: 6
        emergencyThresholdRatio: 0.85
